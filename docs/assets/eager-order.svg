<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 205" role="img">
<title>Illuminate → switch off → read the sensor</title>
<rect width="100%" height="100%" rx="10" fill="#fff"/>
<g font-family="system-ui, sans-serif" fill="#243247">
<text x="24" y="32" font-size="23.400000000000002" fill="#243247" font-weight="600" text-anchor="start">Illuminate → switch off → read the sensor</text>
<rect x="24" y="75" width="270" height="90" rx="8" fill="#f1f5f9" stroke="#cad3df"/>
<text x="159.0" y="111" font-size="20.8" fill="#355cbb" font-weight="600" text-anchor="middle">Light HIGH</text>
<text x="159.0" y="143" font-size="16.900000000000002" fill="#243247" font-weight="400" text-anchor="middle">20 ms</text>
<rect x="306" y="75" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#cad3df"/>
<text x="396.0" y="111" font-size="20.8" fill="#137b67" font-weight="600" text-anchor="middle">Light LOW</text>
<text x="396.0" y="143" font-size="16.900000000000002" fill="#243247" font-weight="400" text-anchor="middle">1 ms</text>
<rect x="498" y="75" width="478" height="90" rx="8" fill="#f1f5f9" stroke="#cad3df"/>
<text x="737.0" y="111" font-size="20.8" fill="#64748b" font-weight="600" text-anchor="middle">Read sensor / choose next action</text>
<text x="737.0" y="143" font-size="16.900000000000002" fill="#243247" font-weight="400" text-anchor="middle">Duration depends on Python</text>
</g></svg>
