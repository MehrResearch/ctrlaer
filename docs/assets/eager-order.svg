<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245">
 <rect width="1200" height="245" rx="10" fill="#101827"/>
 <g font-family="sans-serif" fill="#e6edf7">
  <text x="25" y="30" font-size="21">Eager feedback · command order and variable Python gaps</text>
  <text x="25" y="55" font-size="14" fill="#93a5bc">Burst envelope; schematic is not to scale. Preparation gaps occur between commands.</text>
  <text x="25" y="114" font-size="17">GP0</text>
  <path d="M120 138 V88 H330 V138 H1135" fill="none" stroke="#64d8c5" stroke-width="3"/>
  <rect x="120" y="88" width="210" height="50" fill="#64d8c5" opacity=".55"/>
  <text x="225" y="167" text-anchor="middle" font-size="16">20 ms carrier</text>
  <text x="475" y="167" text-anchor="middle" font-size="16">100 ms LOW</text>
  <rect x="630" y="81" width="240" height="105" rx="8" fill="#ffca70" opacity=".12"/>
  <path d="M630 75 V145 M870 75 V145" stroke="#ffca70" stroke-dasharray="4 4"/>
  <text x="750" y="111" text-anchor="middle" font-size="16" fill="#ffca70">ADC + print + prepare</text>
  <text x="750" y="167" text-anchor="middle" font-size="16" fill="#ffca70">unknown gap; stays LOW</text>
  <text x="1005" y="167" text-anchor="middle" font-size="16">100 ms sleep</text>
  <path d="M120 211 H1130 l-10 -6 m10 6 l-10 6" stroke="#93a5bc" fill="none"/>
  <text x="630" y="232" text-anchor="middle" font-size="14" fill="#93a5bc">Execution order → next loop starts after further Python/preparation time</text>
 </g>
</svg>
