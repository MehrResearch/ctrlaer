site_name: CtrlAer documentation
site_url: https://mehrresearch.github.io/ctrlaer/
site_description: Precisely timed generator programs on MicroPython RP2040 and RP2350 boards
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

repo_url: https://github.com/MehrResearch/ctrlaer
repo_name: MehrResearch/ctrlaer

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Install and upgrade: installation.md
  - Getting started: getting-started.md
  - Pins and wiring: wiring.md
  - Execution modes: execution-modes.md
  - API reference: api-reference.md
  - Examples: examples.md
  - Original FIFO recipes: original-recipes.md
  - Prepared execution: prepared-execution.md
  - Triggers and waveform groups: triggers-and-groups.md
  - Digital capture: digital-capture.md
  - Analysis, scans and records: analysis-and-records.md
  - Implementation and validation: capabilities-plan.md
  - Performance: performance.md
