site_name: CtrlAer documentation
site_url: https://mehrresearch.github.io/ctrlaer/
site_description: Control the timing of laboratory equipment with RP2040/RP2350 microcontrollers
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

repo_url: https://github.com/MehrResearch/ctrlaer
repo_name: MehrResearch/ctrlaer

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Start here:
      - Install and upgrade: installation.md
      - Getting started: getting-started.md
      - Connect a Pico: wiring.md
  - Build an experiment:
      - Control several devices: examples.md
      - External triggers: triggers-and-groups.md
      - Run an experiment: execution-modes.md
      - Prepare and replay: prepared-execution.md
      - Measure a signal: digital-capture.md
      - Previews and records: analysis-and-records.md
      - More recipes: original-recipes.md
  - Understand the timing:
      - Timing and performance: performance.md
      - How CtrlAer works: capabilities-plan.md
  - API reference:
      - Overview: api-reference.md
      - Controllers: api/controller.md
      - Signals and timing: api/signals.md
      - Triggers and groups: api/triggers.md
      - Run objects: api/runs.md
      - Previews and programs: api/analysis.md
      - Digital measurements: api/capture.md
      - Experiment records: api/records.md
      - Errors: api/errors.md
  - Citing CtrlAer: citing.md
